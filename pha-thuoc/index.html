<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Tính lượng thuốc sát trùng</title>

  <meta name="description" content="Công cụ tính lượng thuốc sát trùng theo tỷ lệ pha và dạng thuốc. Hoạt động offline và sử dụng dễ dàng cho trang trại.">
  <meta name="keywords" content="tính thuốc sát trùng, pha thuốc, thuốc sát trùng trại heo, pha thuốc chăn nuôi, ứng dụng offline, an toàn sinh học">
  <meta name="author" content="Hoàng Đợi">
  <meta name="robots" content="index, follow">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pha thuốc">
  <meta name="theme-color" content="#0d9488"/>
  
  <link rel="manifest" href="/pha-thuoc/manifest.webmanifest">
  <link rel="icon" href="/pha-thuoc/icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="/pha-thuoc/icons/icon-180.png">
  <link rel="icon" type="image/png" href="/pha-thuoc/icons/icon-32.png" sizes="32x32">

  <script src="libs/tailwind.min.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#0d9488',
            bgDark: '#0b1220',
            cardDark: '#0f172a',
          }
        }
      }
    }
  </script>

  <style type="text/tailwindcss">
    @layer components {
      .chip {
        @apply py-1 px-3 border border-slate-700 rounded-xl bg-white/5 cursor-pointer text-sm font-semibold text-white text-center transition-all duration-200 select-none;
      }
      .chip:hover {
        @apply border-brand text-teal-300 bg-teal-500/10;
      }
      .chip.is-active, .chip[aria-pressed="true"] {
        @apply border-brand text-teal-300 bg-teal-500/20 ring-1 ring-brand;
      }
    }
  </style>
  <style>
    /* Ẩn input number arrows */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    
    @keyframes slideDown { from { transform: translateY(-100%);} to { transform: translateY(0);} }
    .animate-slideDown { animation: slideDown 0.3s ease-out; }
  </style>
</head>
<body class="bg-gradient-to-b from-bgDark to-slate-900 text-slate-200 min-h-screen font-sans antialiased selection:bg-brand selection:text-teal-950">

  <div id="iosTip" class="hidden fixed left-3 right-3 bottom-3 z-50 bg-slate-900/95 backdrop-blur-md p-3 rounded-2xl border border-slate-800 text-sm shadow-2xl">
    <button id="iosClose" class="float-right bg-brand text-teal-950 px-3 py-2 rounded-xl font-bold ml-3">Đã hiểu</button>
    <b class="text-teal-300">Mẹo:</b> Trên iPhone/iPad → Safari → <b>Chia sẻ</b> → <b>Thêm vào MH chính</b> để cài như ứng dụng.
  </div>

  <button id="btnInstall" class="hidden fixed right-4 bottom-4 bg-brand text-teal-950 px-4 py-3 rounded-2xl font-bold shadow-lg shadow-brand/20 hover:scale-105 transition-transform z-40">
    📥 Cài đặt ứng dụng
  </button>

  <div class="max-w-md mx-auto py-10 px-4">
    <header class="text-center mb-8">
      <h1 class="text-2xl font-extrabold tracking-tight text-white">Tính lượng thuốc sát trùng</h1>
    </header>

    <main class="bg-white/5 backdrop-blur-sm border border-slate-700/50 rounded-3xl shadow-2xl p-5 sm:p-6">
      
      <div class="mb-6">
        <label class="block text-sm font-medium text-slate-400 mb-2">Loại thuốc</label>
        <div class="flex bg-slate-900/80 border border-slate-700 p-1 rounded-full">
          <div class="flex-1 relative">
            <input type="radio" name="medicineFormType" id="liquidMedicine" value="liquid" class="peer sr-only" checked>
            <label for="liquidMedicine" class="block w-full py-2.5 text-center text-slate-400 cursor-pointer text-sm font-medium rounded-full transition-all peer-checked:bg-brand peer-checked:text-teal-950 peer-checked:font-bold peer-checked:shadow-sm">Thuốc nước</label>
          </div>
          <div class="flex-1 relative">
            <input type="radio" name="medicineFormType" id="powderMedicine" value="powder" class="peer sr-only">
            <label for="powderMedicine" class="block w-full py-2.5 text-center text-slate-400 cursor-pointer text-sm font-medium rounded-full transition-all peer-checked:bg-brand peer-checked:text-teal-950 peer-checked:font-bold peer-checked:shadow-sm">Thuốc bột</label>
          </div>
        </div>
      </div>

      <div class="mb-6">
        <label class="block text-sm font-medium text-slate-400 mb-2">Tỷ lệ pha</label>
        <input type="hidden" id="medicineType" required>
        
        <div class="grid grid-cols-2 gap-3" id="ratioChips">
          <div class="chip" data-ratio="1:100">1:100</div>
          <div class="chip" data-ratio="1:200">1:200</div>
          <div class="chip" data-ratio="1:300">1:300</div>
          <div class="chip" data-ratio="1:400">1:400</div>
          <div class="chip" data-ratio="1:500">1:500</div>
          <div class="chip" data-ratio="1:600">1:600</div>
          <div class="chip" data-ratio="1:700">1:700</div>
          <div class="chip" data-ratio="1:800">1:800</div>
          <div class="chip" data-ratio="1:900">1:900</div>
          <div class="chip" data-ratio="1:1000">1:1000</div>
        </div>
      </div>

      <div class="mb-6">
        <label for="litersOfWater" class="block text-sm font-medium text-slate-400 mb-2">Số lượng nước (lít)</label>
        <input type="number" id="litersOfWater" step="0.1" min="0" inputmode="decimal" placeholder="Nhập số lít nước cần sử dụng" required class="w-full bg-slate-900 border border-slate-700 text-white px-4 py-3.5 rounded-2xl text-base outline-none focus:border-brand focus:ring-1 focus:ring-brand transition-all placeholder:text-slate-600">
      </div>

      <div id="result" class="hidden bg-sky-500/10 border border-sky-500/30 text-sky-200 p-4 rounded-2xl text-sm leading-relaxed" aria-live="polite"></div>
      
      <div id="error" class="bg-red-500/10 border border-red-500/30 text-red-200 p-4 rounded-2xl text-sm leading-relaxed">
        Hãy <strong>chọn tỷ lệ thuốc</strong> và nhập số lít nước để hiển thị kết quả.
      </div>

    </main>

    <footer class="text-center text-slate-500 text-sm mt-8 pb-8">
      © 2026 - Hoàng Đợi
    </footer>
  </div>

  <script>
    // ========== HELPERS ==========
    function isIos(){return /iphone|ipad|ipod/i.test(navigator.userAgent)}
    function isStandalone(){return navigator.standalone || window.matchMedia('(display-mode: standalone)').matches}

    function setFormFromParam(form){
      if(form === 'powder'){
        const el = document.getElementById('powderMedicine');
        if(el) el.checked = true;
      }else if(form === 'liquid'){
        const el = document.getElementById('liquidMedicine');
        if(el) el.checked = true;
      }
    }

    // ========== APP UPDATER ==========
    class AppUpdater {
      constructor() {
        this.updateAvailable = false;
        this._notiEl = null;
        this._reloading = false;
        this.init();
      }

      init() {
        if (!('serviceWorker' in navigator)) return;

        navigator.serviceWorker.addEventListener('message', (event) => {
          const { type, version, currentVersion } = event.data || {};
          if (type === 'UPDATE_AVAILABLE') this.showUpdateNotification(version, currentVersion);
        });

        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (this._reloading) return;
          this._reloading = true;
          window.location.reload();
        });

        this.checkForUpdate();
        document.addEventListener('visibilitychange', () => {
          if (!document.hidden) this.checkForUpdate();
        });
      }

      async getRegistration() {
        try { return await navigator.serviceWorker.getRegistration('/pha-thuoc/'); } catch { return null; }
      }

      async checkForUpdate() {
        const reg = await this.getRegistration();
        if (!reg) return;
        try { await reg.update(); } catch {}
        reg.active?.postMessage({ type: 'CHECK_UPDATE' });
      }

      showUpdateNotification(newVersion, currentVersion) {
        if (this.updateAvailable) return;
        this.updateAvailable = true;

        const div = document.createElement('div');
        div.className = 'fixed top-0 left-0 right-0 bg-gradient-to-r from-brand to-teal-600 text-white px-4 py-3 text-center z-[10000] shadow-md animate-slideDown flex flex-col sm:flex-row items-center justify-center gap-3';
        div.innerHTML = `
          <span><strong>🎉 Có bản cập nhật mới (${newVersion})!</strong></span>
          <div class="flex gap-2">
            <button id="btnDoUpdate" class="bg-white text-brand px-3 py-1.5 rounded-lg font-bold text-sm shadow-sm active:scale-95 transition-transform">Cập nhật</button>
            <button id="btnLater" class="border border-white/50 text-white px-3 py-1.5 rounded-lg font-bold text-sm active:scale-95 transition-transform">Để sau</button>
          </div>
        `;
        document.body.appendChild(div);
        this._notiEl = div;

        div.querySelector('#btnDoUpdate')?.addEventListener('click', () => this.applyUpdate());
        div.querySelector('#btnLater')?.addEventListener('click', () => this.hideUpdate());
      }

      async applyUpdate() {
        const reg = await this.getRegistration();
        if (!reg) return;

        if (this._notiEl) this._notiEl.innerHTML = '<span class="font-bold animate-pulse">🔄 Đang đồng bộ phiên bản mới...</span>';
        
        // Gửi lệnh SKIP_WAITING xuống service worker để kích hoạt bản mới lập tức
        if (reg.waiting) {
          reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          return;
        }

        if (reg.installing) {
          reg.installing.addEventListener('statechange', () => {
            if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          });
          return;
        }

        // Trường hợp SW chạy nền ngầm chưa load hoàn chỉnh, ép kiểm tra lại
        reg.active?.postMessage({ type: 'FORCE_UPDATE' });
        setTimeout(() => window.location.reload(), 1000);
      }

      hideUpdate() {
        if (this._notiEl) this._notiEl.remove();
        this._notiEl = null;
        this.updateAvailable = false;
      }
    }

    // ========== SERVICE WORKER REGISTRATION ==========
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          await navigator.serviceWorker.register('/pha-thuoc/service-worker.js', { scope: '/pha-thuoc/', updateViaCache: 'none' });
        } catch (e) {}
      });
    }

    // ========== IOS INSTALL TIP ==========
    window.addEventListener('load',()=>{
      if(isIos() && !isStandalone()) {
        const iosTip = document.getElementById('iosTip');
        if(iosTip) iosTip.classList.remove('hidden');
      }
      const closeBtn = document.getElementById('iosClose');
      if(closeBtn) closeBtn.onclick = () => document.getElementById('iosTip')?.remove();
    });

    // ========== CALCULATION LOGIC ==========
    function calculate(){
      const liters = parseFloat(document.getElementById('litersOfWater').value);
      const type   = document.getElementById('medicineType').value;
      const form   = document.querySelector('input[name="medicineFormType"]:checked').value;
      const error  = document.getElementById('error');
      const result = document.getElementById('result');
      
      error.classList.add('hidden'); 
      result.classList.add('hidden');

      if(!liters) return;

      if(!type){ 
        error.classList.remove('hidden'); 
        error.innerHTML='Bạn chưa <strong>chọn tỷ lệ thuốc</strong> để hiển thị kết quả.'; 
        return; 
      }
      if(isNaN(liters)||liters<=0){ 
        error.classList.remove('hidden'); 
        error.innerHTML='Bạn chưa <strong>nhập lượng nước</strong> hợp lệ.'; 
        return; 
      }

      const ratios={'1:100':100,'1:200':200,'1:300':300,'1:400':400,'1:500':500,'1:600':600,'1:700':700,'1:800':800,'1:900':900,'1:1000':1000};
      const volume=(1000/ratios[type])*liters;
      const display=(form==='powder') ? (Math.round(volume)+' gram') : ((Number.isInteger(volume)?volume:volume.toFixed(2))+' ml');

      result.classList.remove('hidden');
      result.innerHTML=`Với tỷ lệ <strong class="text-white">${type}</strong>, cần pha:<br><strong class="text-white text-base">${liters} lít</strong> nước = <strong class="text-white text-base">${display}</strong> thuốc`;
    }
    
    document.getElementById('litersOfWater').addEventListener('input',calculate);
    document.querySelectorAll('input[name="medicineFormType"]').forEach(r=> r.addEventListener('change',calculate));

    // ========== RATIO CHIPS ==========
    const selectRatio = document.getElementById('medicineType');
    const chipWrap = document.getElementById('ratioChips');
    const chips = [...chipWrap.querySelectorAll('.chip')];

    function setActiveChip(ratio){
      chips.forEach(ch=>{
        const active = ch.dataset.ratio === ratio;
        if(active) ch.classList.add('is-active');
        else ch.classList.remove('is-active');
        ch.setAttribute('aria-pressed', active ? 'true' : 'false');
      });
    }
    
    chipWrap.addEventListener('click', e=>{
      const c = e.target.closest('.chip'); if(!c) return;
      const ratio = c.getAttribute('data-ratio');
      selectRatio.value = ratio;
      setActiveChip(ratio);
      calculate();
    });
    
    chips.forEach(ch=>{
      ch.setAttribute('role','button');
      ch.setAttribute('tabindex','0');
      ch.setAttribute('aria-pressed','false');
      ch.addEventListener('keydown', e=>{
        if(e.key===' '||e.key==='Enter'){ e.preventDefault(); ch.click(); }
      });
    });

    // ========== A2HS INSTALL PROMPT ==========
    let deferredPrompt;
    const btnInstall = document.getElementById('btnInstall');

    function updateInstallVisibility(){
      const canShow = !!deferredPrompt && !isStandalone();
      if (btnInstall) {
        if(canShow) btnInstall.classList.remove('hidden');
        else btnInstall.classList.add('hidden');
      }
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      updateInstallVisibility();
    });

    async function triggerInstall(){
      if(!deferredPrompt){
        if(isIos() && !isStandalone()){
          const tip = document.getElementById('iosTip');
          if(tip) tip.classList.remove('hidden');
        }
        return;
      }
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      updateInstallVisibility();
    }
    
    window.addEventListener('appinstalled', () => {
      deferredPrompt = null;
      updateInstallVisibility();
    });
    
    if(btnInstall) btnInstall.addEventListener('click', triggerInstall);

    // ========== AUTO REQUEST PERSIST ==========
    async function autoPersist(){
      if (!navigator.storage || !navigator.storage.persist || !navigator.storage.persisted) return;
      try{
        const persisted = await navigator.storage.persisted();
        if(!persisted) await navigator.storage.persist();
      }catch(_){}
    }

    // ========== URL PARAMETERS INITIALIZATION ==========
    const p = new URLSearchParams(location.search);
    const ratioParam = p.get('ratio');
    const formParam  = p.get('form');

    if(formParam) setFormFromParam(formParam);
    if(ratioParam){
      selectRatio.value = ratioParam;
      setActiveChip(ratioParam);
    }else{
      setActiveChip(selectRatio.value || '');
    }

    // ========== STARTUP ==========
    updateInstallVisibility();

    window.addEventListener('load', () => {
      new AppUpdater();
      autoPersist();
      if(selectRatio.value) calculate();
    });
  </script>
</body>
</html>
